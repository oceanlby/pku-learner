name: Transfer desktop installers to a draft release

on:
  workflow_dispatch:
    inputs:
      release_id:
        description: Draft release ID
        required: true
        type: string
      artifacts:
        description: JSON with short-lived binary artifact URLs, sizes and SHA-256 digests
        required: true
        type: string

permissions:
  contents: write

jobs:
  transfer:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Validate and upload the installers
        shell: bash
        run: |
          python3 - <<'PY'
          import hashlib
          import json
          import os
          import re
          import shutil
          import subprocess
          import urllib.parse
          import urllib.request
          import zipfile
          from pathlib import Path

          def gh_json(route):
              return json.loads(subprocess.check_output(["gh", "api", route]))

          event = json.loads(Path(os.environ["GITHUB_EVENT_PATH"]).read_text())
          inputs = event["inputs"]
          repo = os.environ["GITHUB_REPOSITORY"]
          if repo != "oceanlby/pku-learner" or not re.fullmatch(r"\d+", inputs["release_id"]):
              raise SystemExit("Unexpected release destination.")
          route = f"repos/{repo}/releases/{inputs['release_id']}"
          release = gh_json(route)
          tag = release["tag_name"]
          if not release["draft"] or not re.fullmatch(r"v\d+\.\d+\.\d+", tag):
              raise SystemExit("A versioned draft release is required.")
          version = tag[1:]
          names = {
              "pku-learner-macOS-arm64": [f"pku-learner-{version}-mac-arm64.{ext}" for ext in ("dmg", "zip")],
              "pku-learner-macOS-x64": [f"pku-learner-{version}-mac-x64.{ext}" for ext in ("dmg", "zip")],
              "pku-learner-Linux-x64": [f"pku-learner-{version}-linux-x86_64.AppImage"],
              "pku-learner-Windows-x64": [f"pku-learner-Setup-{version}-win-x64.exe"],
          }

          def file_digest(path):
              with path.open("rb") as handle:
                  return "sha256:" + hashlib.file_digest(handle, "sha256").hexdigest()

          artifacts = json.loads(inputs["artifacts"])
          if sorted(artifact["name"] for artifact in artifacts) != sorted(names):
              raise SystemExit("Expected all desktop platforms exactly once.")
          checksums = []
          for artifact in artifacts:
              platform = artifact["name"]
              expected = names[platform]
              url = artifact["url"]
              location = urllib.parse.urlparse(url)
              if location.scheme != "https" or not location.hostname.endswith(".blob.core.windows.net"):
                  raise SystemExit("Unexpected artifact host.")
              print(f"::add-mask::{url}", flush=True)
              archive = Path(os.environ["RUNNER_TEMP"], platform + ".zip")
              try:
                  with urllib.request.urlopen(url, timeout=60) as response, archive.open("wb") as output:
                      shutil.copyfileobj(response, output, 1024 * 1024)
              except Exception:
                  raise SystemExit(f"Could not download the binary archive for {platform}.") from None
              if archive.stat().st_size != artifact["size"] or file_digest(archive) != artifact["digest"]:
                  raise SystemExit(f"Archive verification failed for {platform}.")
              with zipfile.ZipFile(archive) as bundle:
                  if sorted(bundle.namelist()) != sorted(expected):
                      raise SystemExit(f"Unexpected contents in {platform}.")
                  for name in expected:
                      with bundle.open(name) as source, Path(name).open("wb") as output:
                          shutil.copyfileobj(source, output, 1024 * 1024)
              archive.unlink()
              current = gh_json(route)
              if not current["draft"] or current["tag_name"] != tag:
                  raise SystemExit("The destination release changed.")
              existing = {item["name"]: item for item in current["assets"]}
              for name in expected:
                  digest = file_digest(Path(name))
                  if name in existing:
                      if existing[name]["digest"] != digest:
                          raise SystemExit(f"Existing asset differs: {name}")
                  else:
                      subprocess.run(["gh", "release", "upload", tag, name, "--repo", repo], check=True)
                  checksums.append(f"{digest.removeprefix('sha256:')}  {name}\n")
                  print(f"Verified {name}", flush=True)

          current = gh_json(route)
          if not current["draft"] or current["tag_name"] != tag:
              raise SystemExit("The destination release changed.")
          sums = Path("SHA256SUMS.txt")
          sums.write_text("".join(sorted(checksums)), encoding="ascii")
          existing_sums = next((item for item in current["assets"] if item["name"] == sums.name), None)
          if existing_sums:
              if existing_sums["digest"] != file_digest(sums):
                  raise SystemExit("Existing checksum file differs.")
          else:
              subprocess.run(["gh", "release", "upload", tag, sums.name, "--repo", repo], check=True)
          PY
