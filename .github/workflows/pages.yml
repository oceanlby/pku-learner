name: Publish download website

on:
  push:
    branches: [main]
  release:
    types: [published, unpublished, deleted, edited]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/configure-pages@v5
      - name: Prepare site and release data
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir _site
          cp index.html site.css downloads.js gallery.js icon.png latest.json .nojekyll _site/
          cp -R screenshots _site/
          if gh api "repos/${GITHUB_REPOSITORY}/releases/latest" > release.json; then
            jq '{tag_name,body,html_url,assets:[.assets[]|{name,size,browser_download_url}]}' release.json > _site/latest.json
          fi
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - uses: actions/deploy-pages@v4
        id: deployment
